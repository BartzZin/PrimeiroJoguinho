# Linux server only. Local Windows compose keeps restart: no.
services:
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configure o domínio real em .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  caddy-data:
  caddy-config:
