[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xadrez-arcano-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "alembic", "pydantic-settings", "cryptography"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "websockets", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

