name: Validate
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: arcano
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: arcano_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U arcano -d arcano_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://arcano:ci_only@localhost:5432/arcano_test
      TEST_DATABASE_URL: postgresql+psycopg://arcano:ci_only@localhost:5432/arcano_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - run: pip install -r server/requirements.lock && pip install --no-deps -e server
      - run: ruff check server
      - run: alembic -c server/alembic.ini upgrade head
      - run: pytest server/tests -q
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot
        run: |
          curl -fLO https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fLO https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/SHA512-SUMS.txt
          grep 'Godot_v4.7.2-stable_linux.x86_64.zip$' SHA512-SUMS.txt | sha512sum -c -
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
      - run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path client-godot --editor --import --quit
      - run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path client-godot --script res://tests/models.gd
      - run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path client-godot --script res://tests/diagnostics.gd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r server/requirements.lock
      - run: python tools/test_client_network.py --godot ./Godot_v4.7.2-stable_linux.x86_64
      - run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path client-godot --quit-after 120
